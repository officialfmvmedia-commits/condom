# Render Blueprint for the CONDOM API (ticker registry + IPFS upload).
# The existing static site (thecondom.fun) stays as-is; its ONLY env var is VITE_API_URL.
# Do NOT set any RPC URL/key on the static site: the browser uses ${VITE_API_URL}/rpc (proxy below).
databases:
  - name: condom-db
    databaseName: condom
    user: condom
    plan: basic-256mb
    ipAllowList: [] # internal connections only

services:
  - type: web
    name: condom-api
    runtime: node
    rootDir: server
    plan: starter
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: false
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: DATABASE_URL
        fromDatabase:
          name: condom-db
          property: connectionString
      - key: RPC_URL # server-only mainnet RPC (Helius URL incl. key). Used by /rpc proxy, confirm, genesis watcher.
        sync: false
      - key: PINATA_JWT # Pinata JWT with pinFileToIPFS / files:write
        sync: false
      - key: ALLOWED_ORIGINS # optional extra CORS origins, comma separated
        sync: false
      - key: GENESIS_CREATORS # wallets whose first pump.fun create is auto-born on CONDOM (comma list)
        value: 4nPHm2VvuUqdot31hvCKPXPUmF5GwJYdJd5tvgoqrJzr
      - key: GENESIS_MAX_PER_CREATOR # optional, default 1 (first create only)
        sync: false
