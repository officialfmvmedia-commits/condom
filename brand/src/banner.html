<!doctype html><html><head><link rel="stylesheet" href="common.css"><style>
body{width:1500px;height:500px;position:relative;font-family:Geist;color:#F4F6F5}
.glow{position:absolute;inset:0;background:
 radial-gradient(600px 380px at 1180px 250px, rgba(59,255,180,.22), transparent 70%),
 radial-gradient(900px 500px at 300px 620px, rgba(59,255,180,.07), transparent 70%)}
.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:50px 50px;mask-image:radial-gradient(800px 400px at 900px 250px,#000,transparent)}
.rings{position:absolute;left:1180px;top:250px}
.rings i{position:absolute;border:1px solid rgba(59,255,180,.16);border-radius:50%;transform:translate(-50%,-50%)}
.seal{position:absolute;left:1030px;top:100px;width:300px;height:300px;filter:drop-shadow(0 0 40px rgba(59,255,180,.35))}
.copy{position:absolute;left:420px;top:110px}
.wm{height:44px;display:block;margin-bottom:34px}
h1{font-family:Unbounded;font-weight:800;font-size:56px;letter-spacing:-.01em;line-height:1}
h1 em{font-style:normal;color:#3BFFB4}
.sub{margin-top:26px;display:flex;gap:12px;font-family:GeistMono;font-size:15px;letter-spacing:.14em;text-transform:uppercase}
.sub span{padding:10px 16px;border:1px solid rgba(255,255,255,.12);border-radius:999px;background:rgba(255,255,255,.03)}
.sub span b{color:#3BFFB4;font-weight:600}
</style></head><body>
<div class="glow"></div><div class="grid"></div>
<div class="rings"><i style="width:420px;height:420px"></i><i style="width:560px;height:560px"></i><i style="width:720px;height:720px;opacity:.6"></i><i style="width:900px;height:900px;opacity:.35"></i></div>
<img class="seal" src="../svg/condom-seal-protected.svg">
<div class="copy">
 <img class="wm" src="../svg/condom-wordmark-bone.svg">
 <h1>NO MORE<br><em>BLOCK ZEROES.</em></h1>
 <div class="sub"><span><b>MAX 1%</b> dev buy</span><span>dev never buys <b>block 0</b></span></div>
</div>
<div class="grain"></div>
</body></html>
